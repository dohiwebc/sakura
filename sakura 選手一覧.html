<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>選手一覧</title>


  <style>
    body {
      font-family: 'Arial', sans-serif;
    }

    h1 {
      text-align: center;
    }

    table {
      border-collapse: collapse;
      width: 95%;
      max-width: 1200px;
      margin: 20px auto;
    }

    th,
    td {
      border: 1px solid #aaa;
      padding: 6px 10px;
      text-align: center;
      user-select: none;
    }

    th {
      background-color: #f0f0f0;
      cursor: pointer;
      position: relative;
    }


    th.sorted-asc::after {
      content: "▲";
      position: absolute;
      right: 8px;
      font-size: 12px;
    }

    th.sorted-desc::after {
      content: "▼";
      position: absolute;
      right: 8px;
      font-size: 12px;
    }

    tbody tr:hover {
      background-color: #eef;
    }

    body {
      font-family: "Yu Gothic", sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: #fffcdb;
    }
    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .section {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .left {
      flex: 1;
      padding: 10px;
    }
    .right {
      flex: 1;
      padding: 10px;
      margin-left: 20px;
    }
    .rating-table {
      width: 100%;
      text-align: left;
      font-size: 18px;
    }
    .rating-table td {
      padding: 5px;
    }
    .rank-display {
      font-size: 24px;
      font-weight: bold;
    }
    .small-text {
      font-size: 12px;
    }
    #hamburger {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 1001;
  background: white;
  padding: 5px 10px;
  border-radius: 4px;
  box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

#sideMenu a {
  color: #333;
  text-decoration: none;
  display: block;
  padding: 8px 0;
}

#sideMenu a:hover {
  background-color: #ddd;
}
  </style>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script src="firebase-access.js?v=1"></script>
</head>

<body>
  <h1>ドッジボール選手一覧</h1>
  <table id="playerTable">
    <thead>
      <tr>
        <th data-key="name">選手名</th>
        <th data-key="control">コントロール</th>
        <th data-key="speed">球速</th>
        <th data-key="technique">テクニック</th>
        <th data-key="ballPower">球威</th>
        <th data-key="handCatch">ハンドキャッチ</th>
        <th data-key="feint">フェイント</th>
        <th data-key="passcut">パスカット</th>
        <th data-key="defensecut">ディフェンスカット</th>
        <th data-key="spinControl">スピンコントロール</th>
        <th data-key="stamina">スタミナ</th>
        <th data-key="agility">俊敏性</th>
        <th data-key="reflexes">反射神経</th>
        <th data-key="catching">キャッチング</th>
        <th data-key="aggressiveness">積極性</th>
        <th data-key="conditionStability">コンディション安定</th>
        <th data-key="vision">視野</th>
        <th data-key="thinking">思考力</th>
        <th data-key="teamwork">連携力</th>
        <th data-key="tacticalUnderstanding">戦術理解</th>
        <th data-key="attackAwareness">攻撃意識</th>
        <th data-key="defenseAwareness">守備意識</th>
        <th data-key="pressureResistance">プレッシャー耐性</th>
        <th data-key="positioning">ポジショニング</th>
        <th data-key="totalScore">合計点</th>
      </tr>
    </thead>
    <tbody>
      <!-- データここに挿入 -->
    </tbody>
  </table>

<!-- ハンバーガーメニューのアイコン -->
<div id="hamburger" style="cursor:pointer; font-size: 24px; user-select: none;">
  &#9776; <!-- 三本線の記号 -->
</div>


<!-- サイドメニュー -->
<div id="sideMenu" style="display:none; position:fixed; top:0; left:0; width:200px; height:100vh; background:#eee; padding:20px; box-shadow: 2px 0 5px rgba(0,0,0,0.2);">
  <nav>
    <ul style="list-style:none; padding:0;">
      <li><a href="https://huuka1419.stars.ne.jp/testindex.html">能力評価ページ</a></li>
      <li><a href="sakura選手一覧.html">選手一覧ページ</a></li>
    </ul>
  </nav>
</div>


<script type="module">
const abilities = ["control","speed","technique","ballPower","handCatch","feint","passcut","defensecut","spinControl","stamina","agility","reflexes","catching","aggressiveness","conditionStability","vision","thinking","teamwork","tacticalUnderstanding","attackAwareness","defenseAwareness","pressureResistance","positioning"];
const tbody = document.querySelector('#playerTable tbody');
let players = [], currentSortKey = 'name', currentSortAsc = true;
function render() {
  const sorted = players.slice().sort((a,b) => {
    const value = currentSortKey === 'name' ? a.name.localeCompare(b.name, 'ja') : (Number(a[currentSortKey]) || 0) - (Number(b[currentSortKey]) || 0);
    return currentSortAsc ? value : -value;
  });
  tbody.replaceChildren();
  sorted.forEach(player => {
    const tr = document.createElement('tr');
    ['name', ...abilities, 'totalScore'].forEach(key => {
      const td = document.createElement('td'); td.textContent = String(player[key] ?? ''); tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.querySelectorAll('th').forEach(th => {
    th.classList.remove('sorted-asc','sorted-desc');
    if (th.dataset.key === currentSortKey) th.classList.add(currentSortAsc ? 'sorted-asc' : 'sorted-desc');
  });
}
document.querySelectorAll('#playerTable thead th').forEach(th => th.addEventListener('click', () => {
  const key = th.dataset.key; if (!key) return;
  currentSortAsc = currentSortKey === key ? !currentSortAsc : true; currentSortKey = key; render();
}));
const hamburger = document.getElementById('hamburger'), sideMenu = document.getElementById('sideMenu');
if (hamburger && sideMenu) hamburger.addEventListener('click', () => { sideMenu.style.display = sideMenu.style.display === 'block' ? 'none' : 'block'; });
SakuraAccess.ready.then(() => {
  SakuraAccess.db.ref('players').on('value', snapshot => {
    players = Object.entries(snapshot.val() || {}).filter(([,p]) => p && typeof p === 'object' && p.deleted !== true).map(([name,p]) => {
      const row = { name };
      abilities.forEach(key => { row[key] = Number(p.scores?.[key]) || 0; });
      row.totalScore = abilities.reduce((sum,key) => sum + row[key], 0); return row;
    });
    render();
  }, () => { tbody.replaceChildren(); });
});
</script>
</body>
</html>
